name: shellcheck

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run shellcheck
        run: shellcheck cc.sh test/*.sh benchmark/*.sh
      - name: Run tests
        run: sh test/run.sh
