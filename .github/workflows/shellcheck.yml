name: shellcheck

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run shellcheck
        run: shellcheck cc.sh test/*.sh benchmark/*.sh
      - name: Run tests
        run: sh test/run.sh
